name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.28.3/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.x'
          cache: true
      - name: Check
        run: nix flake check --print-build-logs
      - name: Build archives
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9][0-9A-Za-z.-]*$ ]]; then
            printf 'invalid release tag: %s\n' "$TAG" >&2
            exit 1
          fi
          version="${TAG#v}"
          commit="$(git rev-parse --verify HEAD)"
          date="$(git show -s --format=%cI HEAD)"
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="parrot-${version}-${os}-${arch}"
            stage="$RUNNER_TEMP/$name"
            mkdir -p "$stage"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=$version -X main.commit=$commit -X main.date=$date" \
              -o "$stage/parrot" ./cmd/parrot
            cp README.md "$stage/README.md"
            if [[ -f LICENSE ]]; then
              cp LICENSE "$stage/LICENSE"
            fi
            tar -C "$RUNNER_TEMP" -czf "dist/$name.tar.gz" "$name"
          done
          (
            cd dist
            sha256sum ./*.tar.gz > SHA256SUMS
          )
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --generate-notes --title "$TAG"
          fi
